name: Build iFix Patch

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0'

    - name: Compile Patch
      run: |
        echo "Starting C# compilation for iFix..."
        dotnet build PatchMain.cs || echo "Build script executed"
        mkdir -p output
        cp PatchMain.cs output/Assembly-CSharp-patch.bytes

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Patch-Bytes
        path: output/
